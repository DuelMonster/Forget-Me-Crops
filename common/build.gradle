plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
    id 'com.github.spotbugs' version '5.1.3'
}

// Enable PMD for static analysis checks (non-blocking)
apply plugin: 'pmd'

pmd {
    // Use a PMD 7.x release that supports newer Java class file versions (Java 21+)
    // Adjust if your environment has a different preferred PMD 7.x version.
    toolVersion = '7.0.0'
    ignoreFailures = true
    consoleOutput = true
    // Use default ruleSets to avoid configuration mismatches
}

spotbugs {
    // Non-blocking SpotBugs analysis; adjust toolVersion as needed.
    ignoreFailures = true
    showProgress = false
    // Try a newer SpotBugs tool version that supports newer class file formats (Java 21+)
    toolVersion = '4.9.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version)
    }
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:21.11.153"
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}

test {
    useJUnitPlatform()
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute for all loader variants
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        if (variant != null) {
            configurations.named(variant) {
                attributes {
                    attribute(loaderAttribute, 'common')
                }
            }
        }
    }
}
