name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3G

jobs:
  build_and_package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build and package release
        run: ./gradlew clean :fabric:build :neoforge:build packageReleases -i --no-daemon
      - name: Read mod_version
        id: mod_version
        run: |
          echo "mod_version=$(grep -E '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')" >> $GITHUB_OUTPUT
      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: releases/${{ steps.mod_version.outputs.mod_version }}.zip

  publish:
    needs: build_and_package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-zip
      - name: Show artifacts
        run: ls -la releases || true
      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          files: releases/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to Modrinth (optional)
        if: ${{ secrets.MODRINTH_TOKEN && secrets.MODRINTH_PROJECT_ID }}
        run: |
          echo "MODRINTH publish not configured in build; add a publish step or Gradle plugin to automate this."
      - name: Publish to CurseForge (optional)
        if: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          echo "CurseForge publishing not configured; configure an upload action or script."
