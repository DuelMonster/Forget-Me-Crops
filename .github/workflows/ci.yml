name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Grant execute permissions for gradlew
        run: chmod +x ./gradlew
      - name: Build (includes tests)
        run: ./gradlew clean build -i --no-daemon
      - name: Package releases
        run: ./gradlew packageReleases -i --no-daemon

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Grant execute permissions for gradlew
        run: chmod +x ./gradlew
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Fabric smoke test
        run: |
          mkdir -p smoke-logs
          xvfb-run --auto-servernum --server-args='-screen 0 1024x768x24' timeout 180s ./gradlew -PfhNoRelatedMods=true :fabric:runClient --no-daemon -i 2>&1 | tee smoke-logs/fabric.log
          grep -q "Mod initialization started! If you see this, the core logic is alive and kicking." smoke-logs/fabric.log
      - name: NeoForge smoke test
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1024x768x24' timeout 180s ./gradlew -PfhNoRelatedMods=true :neoforge:runClient --no-daemon -i 2>&1 | tee smoke-logs/neoforge.log
          grep -q "Mod initialization started! If you see this, the core logic is alive and kicking." smoke-logs/neoforge.log
