plugins {
    id "multiloader-loader"
    id "net.neoforged.moddev"
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    mavenCentral()
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(":common").file("src/main/resources/META-INF/accesstransformer.cfg")
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty("neoforge.enabledGameTestNamespaces", mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            // Use runs/client like Fabric so installed related_mods jars are picked up
            gameDirectory = project.file('runs/client')
        }
        data {
            clientData()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll "--mod", project.mod_id, "--all", "--output", file("src/generated/resources/").getAbsolutePath(), "--existing", file("src/main/resources/").getAbsolutePath()
        }
        server {
            server()
            // Use runs/server to match Fabric layout
            gameDirectory = project.file('runs/server')
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation(project(":common")) {
        attributes {
            attribute(Attribute.of('io.github.mcgradleconventions.loader', String), 'common')
        }
    }
    // ClothConfig: prefer Maven artifact for NeoForge builds
    implementation("me.shedaniel.cloth:cloth-config-neoforge:21.11.153")

}

sourceSets.main.resources { srcDir "src/generated/resources" }

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of("io.github.mcgradleconventions.loader", String)
["apiElements", "runtimeElements", "sourcesElements", "javadocElements"].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, "neoforge")
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, "neoforge")
            }
        }
    }
}


// --- Related Mods Handling (NeoForge, modeled after Fabric baseline) ---
def fastItemFramesNeoForgeJarPath = providers.gradleProperty('fastItemFramesNeoForgeJar')
        .orElse(providers.gradleProperty('fastItemFramesJar'))
def relatedModsDir = rootProject.file('related_mods')
def relatedModNameTokens = ['fastitemframes', 'puzzleslib', 'neoforge', 'forgeconfigapiport']
def loaderToken = 'neoforge'
def skipRelatedModsInstall = providers.gradleProperty('fhNoRelatedMods').map { it.toBoolean() }.orElse(false)

tasks.register('installFastItemFramesForClientNeoForge') {
    group = 'run setup'
    description = 'Copies FastItemFrames and PuzzlesLib NeoForge jars into the NeoForge run mods folder.'

    doLast {
        if (skipRelatedModsInstall.get()) {
            logger.lifecycle('Skipping related NeoForge mod install (-PfhNoRelatedMods=true).')
            return
        }

        def jarsToInstall = []

        if (relatedModsDir.exists()) {
            jarsToInstall.addAll(relatedModsDir.listFiles()?.findAll { f ->
                def lower = f.name.toLowerCase()
                f.isFile() && lower.endsWith('.jar') && lower.contains(loaderToken) && relatedModNameTokens.any { token -> lower.contains(token) }
            } ?: [])
        }

        if (jarsToInstall.isEmpty() && fastItemFramesNeoForgeJarPath.present) {
            def sourceJar = file(fastItemFramesNeoForgeJarPath.get())
            if (!sourceJar.exists()) {
                throw new GradleException("FastItemFrames jar not found: ${sourceJar}")
            }
            jarsToInstall.add(sourceJar)
        }

        if (jarsToInstall.isEmpty()) {
            throw new GradleException("No NeoForge FastItemFrames/PuzzlesLib jars found in ${relatedModsDir}. Expected loader name in filenames (e.g. *NeoForge*.jar).")
        }

        def modsDir = file('runs/client/mods')
        modsDir.mkdirs()

        modsDir.listFiles()?.findAll { f ->
            def lower = f.name.toLowerCase()
            f.isFile() && lower.endsWith('.jar') && relatedModNameTokens.any { token -> lower.contains(token) }
        }?.each { stale ->
            stale.delete()
        }

        jarsToInstall.each { jarFile ->
            copy {
                from(jarFile)
                into(modsDir)
            }
            logger.lifecycle("Installed NeoForge related mod jar: ${jarFile.name}")
        }
    }
}

tasks.named('runClient') {
    dependsOn(tasks.named('installFastItemFramesForClientNeoForge'))

    doFirst {
        if (skipRelatedModsInstall.get()) {
            logger.lifecycle('Running NeoForge client without related_mods jars (-PfhNoRelatedMods=true).')
            def modsDir = file('runs/client/mods')
            modsDir.listFiles()?.findAll { f ->
                def lower = f.name.toLowerCase()
                f.isFile() && lower.endsWith('.jar') && relatedModNameTokens.any { token -> lower.contains(token) }
            }?.each { stale ->
                stale.delete()
                logger.lifecycle("[FastHarvester] Removed related mod jar: ${stale.name}")
            }
        }
    }
}

tasks.named('runServer') {
    doFirst {
        if (skipRelatedModsInstall.get()) {
            logger.lifecycle('Running NeoForge server without related_mods jars (-PfhNoRelatedMods=true).')
            def modsDir = file('runs/server/mods')
            modsDir.listFiles()?.findAll { f ->
                def lower = f.name.toLowerCase()
                f.isFile() && lower.endsWith('.jar') && relatedModNameTokens.any { token -> lower.contains(token) }
            }?.each { stale ->
                stale.delete()
                logger.lifecycle("[FastHarvester] Removed related mod jar: ${stale.name}")
            }
        }
    }
}



