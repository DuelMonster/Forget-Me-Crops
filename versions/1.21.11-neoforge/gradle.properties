# Modstitch reads modstitch.platform to decide which toolchain to activate.
# ─────────────────────────────────────────────────────────────

# Activate NeoForge ModDevGradle for this node
modstitch.platform=moddevgradle

# Minecraft version for this node
deps.minecraft=1.21.11

# NeoForge — see https://projects.neoforged.net/neoforged/neoforge for new versions
