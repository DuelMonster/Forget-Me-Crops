plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1" apply false
    // see https://fabricmc.net/develop/ for new versions
    id "fabric-loom" version "1.13-SNAPSHOT" apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id "net.neoforged.moddev" version "2.0.123" apply false
    // SpotBugs plugin available for subprojects (apply false here)
    id "com.github.spotbugs" version "5.1.3" apply false
}

allprojects {
    apply plugin: "java"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(java_version)
        }
    }
}

// Publishing to Modrinth and CurseForge – only enabled when API keys are set.
// The tasks are defined in the buildSrc plugin and are conditionally applied
// based on the presence of the environment variables MODRINTH_TOKEN and
// CURSEFORGE_TOKEN.
// apply plugin: "com.github.johnrengelman.shadow" // for fat jars if needed

tasks.register("publishModrinth") {
    group = "publishing"
    description = "Publish the mod to Modrinth if MODRINTH_TOKEN is set."
    doLast {
        if (!System.getenv("MODRINTH_TOKEN")) {
            println "MODRINTH_TOKEN not set – skipping Modrinth publish."
            return
        }
        // Placeholder: actual upload logic would go here.
        println "Publishing to Modrinth (token present)."
    }
}

tasks.register("publishCurseForge") {
    group = "publishing"
    description = "Publish the mod to CurseForge if CURSEFORGE_TOKEN is set."
    doLast {
        if (!System.getenv("CURSEFORGE_TOKEN")) {
            println "CURSEFORGE_TOKEN not set – skipping CurseForge publish."
            return
        }
        // Placeholder: actual upload logic would go here.
        println "Publishing to CurseForge (token present)."
    }
}

tasks.register('cleanLoaderLibs') {
    group = 'release'
    description = 'Delete all files from fabric/build/libs and neoforge/build/libs before packaging.'
    doLast {
        delete fileTree('fabric/build/libs') { include '**/*' }
        delete fileTree('neoforge/build/libs') { include '**/*' }
    }
}

project(':fabric').tasks.named('build') {
    mustRunAfter(tasks.named('cleanLoaderLibs'))
}

project(':neoforge').tasks.named('build') {
    mustRunAfter(tasks.named('cleanLoaderLibs'))
}

// Release packaging: copy built runtime jars into releases/
tasks.register('packageReleases') {
    group = 'release'
    description = 'Build and copy runtime Fabric/NeoForge jars into releases/.'
    dependsOn('cleanLoaderLibs', ':fabric:build', ':neoforge:build')
    doLast {
        def out = file('releases')
        out.mkdirs()

        def runtimeJarFor = { String loader, String libsDir ->
            def jars = fileTree(libsDir).matching {
                include '**/*.jar'
                exclude '**/*-sources.jar', '**/*-javadoc.jar'
            }.files.sort { a, b -> b.lastModified() <=> a.lastModified() }
            def runtimeJar = jars.find { f -> !f.name.contains('-dev') }
            return runtimeJar ?: jars.find { true }
        }

        def fabricRuntimeJar = runtimeJarFor('fabric', 'fabric/build/libs')
        if (fabricRuntimeJar == null) {
            throw new GradleException('No Fabric runtime jar found in fabric/build/libs')
        }

        def neoForgeRuntimeJar = runtimeJarFor('neoforge', 'neoforge/build/libs')
        if (neoForgeRuntimeJar == null) {
            throw new GradleException('No NeoForge runtime jar found in neoforge/build/libs')
        }

        copy {
            from fabricRuntimeJar
            into out
        }

        copy {
            from neoForgeRuntimeJar
            into out
        }

        println "Packaged release jars into: ${out}"
    }
}

// Configure PMD and SpotBugs for subprojects to allow repo-wide analysis tasks
subprojects {
    // Apply PMD (core Gradle plugin) and SpotBugs (third-party plugin)
    apply plugin: 'pmd'
    apply plugin: 'com.github.spotbugs'

    pmd {
        toolVersion = '7.0.0'
        ignoreFailures = true
        consoleOutput = true
    }

    spotbugs {
        toolVersion = '4.9.0'
        ignoreFailures = true
        showProgress = false
        excludeFilter = rootProject.file('config/spotbugs-exclude.xml')
    }
}
